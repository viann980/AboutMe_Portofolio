<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Muhamad Luthfian</title>
    <link rel="icon" type="image/png" href="images/mj.jpg">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    
    <link href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <link rel="stylesheet" href="css/open-iconic-bootstrap.min.css">
    <link rel="stylesheet" href="css/animate.css">
    
    <link rel="stylesheet" href="css/owl.carousel.min.css">
    <link rel="stylesheet" href="css/owl.theme.default.min.css">
    <link rel="stylesheet" href="css/magnific-popup.css">

    <link rel="stylesheet" href="css/aos.css">

    <link rel="stylesheet" href="css/ionicons.min.css">
    
    <link rel="stylesheet" href="css/flaticon.css">
    <link rel="stylesheet" href="css/icomoon.css">
    <link rel="stylesheet" href="css/style.css">

  <style>
    /* --- RESET & BASE --- */
    html, body {
            max-width: 100% !important;
            overflow-x: hidden !important;
        }
    /* --- NAV FIX: MEMASTIKAN NAVBAR TAMPIL --- */
    .custom-navbar {
      background-color: #000 !important;
      padding: 15px 0;
      border-bottom: 1px solid rgba(255, 215, 0, 0.2);
      position: sticky;
      top: 0;
      z-index: 9999; /* Sangat tinggi agar tidak tertutup kartu */
    }
    .navbar-brand { font-weight: 900; letter-spacing: 1px; color: #fff !important; }
    .nav-link { color: rgba(255,255,255,0.7) !important; font-weight: 400; }
    .nav-link:hover { color: #FFD700 !important; }
    .nav-link.active { color: #FFD700 !important; border-bottom: 2px solid #FFD700; }

    /* --- HEADER ASLI --- */
    .ftco-section { padding: 50px 0; }
    .project-heading-wrapper { position: relative; padding: 40px 0; text-align: center; }
    .bg-text { font-size: 100px; font-weight: 900; color: rgba(46, 46, 46, 0.4); position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 0; pointer-events: none; user-select: none; }
    .main-title { font-size: 2.8rem; font-weight: 800; color: white; z-index: 2; position: relative; }
    .subtext { font-size: 1rem; color: #bdbdbd; z-index: 2; position: relative; margin: 10px auto; border-right: 2px solid #FFD700; width: fit-content; padding-right: 10px; }

    /* --- SISTEM 3D CARD TRACKER --- */
    .project-container { position: relative; width: 100%; height: 320px; margin-bottom: 30px; }
    .canvas { perspective: 1200px; inset: 0; z-index: 200; position: absolute; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); }
    .tracker { position: relative; z-index: 300; width: 100%; height: 100%; }
    .tracker.tr-13 { cursor: pointer; }

    .project-card-ui {
      position: absolute; inset: 0; z-index: 0; display: flex; justify-content: center; align-items: center;
      border-radius: 15px; transition: all 0.5s cubic-bezier(0.03, 0.98, 0.52, 0.99);
      background-size: cover; background-position: center; border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden; transform-style: preserve-3d; pointer-events: none;
    }

    .tracker:hover ~ .project-card-ui { box-shadow: 0 0 30px rgba(255, 215, 0, 0.3); border: 1px solid rgba(255, 215, 0, 0.5); }
    .tr-13:hover ~ .project-card-ui { filter: brightness(1.2); box-shadow: 0 0 50px rgba(255, 215, 0, 0.5); }

    .overlay-content {
      position: absolute; inset: 0; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px);
      opacity: 0; transition: 0.4s; display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    .tracker:hover ~ .project-card-ui .overlay-content { opacity: 1; }

    .project-card-ui h3 { font-size: 1.4rem; font-weight: 700; color: #fff; transform: translateZ(80px); margin: 0; }
    .project-card-ui span { color: #FFD700; font-size: 0.8rem; transform: translateZ(50px); letter-spacing: 2px; margin-top: 5px; }

    /* --- ROTASI 25 TITIK --- */
    .tr-1:hover ~ .project-card-ui { transform: rotateX(20deg) rotateY(-20deg); }
    .tr-3:hover ~ .project-card-ui { transform: rotateX(20deg) rotateY(0deg); }
    .tr-5:hover ~ .project-card-ui { transform: rotateX(20deg) rotateY(20deg); }
    .tr-11:hover ~ .project-card-ui { transform: rotateX(0deg) rotateY(-20deg); }
    .tr-13:hover ~ .project-card-ui { transform: rotateX(0deg) rotateY(0deg) scale(1.1); }
    .tr-15:hover ~ .project-card-ui { transform: rotateX(0deg) rotateY(20deg); }
    .tr-21:hover ~ .project-card-ui { transform: rotateX(-20deg) rotateY(-20deg); }
    .tr-23:hover ~ .project-card-ui { transform: rotateX(-20deg) rotateY(0deg); }
    .tr-25:hover ~ .project-card-ui { transform: rotateX(-20deg) rotateY(20deg); }

    @media (max-width: 768px) {
      .bg-text { font-size: 60px; top: 0; }
      .main-title { font-size: 2rem; }
      .project-container { height: 280px; }
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">MUHAMAD LUTHFIAN</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">About</a></li>
          <li class="nav-item"><a class="nav-link active" href="#">Projects</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="ftco-section">
    <div class="container container-projects">
      <div class="project-heading-wrapper">
        <h1 class="bg-text">Projects</h1>
        <h2 class="main-title">Our Projects</h2>
        <p class="subtext" id="typing-text"></p>
      </div>

      <div class="row" id="project-row">
        </div>
    </div>
  </section>

  <script>
    const projects = [
      { name: "Corona Character", cat: "Vector Design", img: "images/corona.jpg", url: "https://lynk.id/disableflow/xk1e94x5p1rp" },
      { name: "Meat Character", cat: "Illustration", img: "images/daging.jpg", url: "#" },
      { name: "Burger Mascot", cat: "Digital Art", img: "images/Burger.png", url: "#" },
      { name: "Donut Mascot", cat: "UI Icon", img: "images/donat.png", url: "#" },
      { name: "Logo Earth", cat: "Branding", img: "images/bumi.jpg", url: "#" },
      { name: "Ice Cream Logo", cat: "Branding", img: "images/eskrim.jpg", url: "#" },
      { name: "Heart Logo", cat: "Branding", img: "images/jantung.png", url: "#" },
      { name: "Potato Logo", cat: "Branding", img: "images/kentang.jpg", url: "#" },
      { name: "Peanepir Logo", cat: "Branding", img: "images/peanepir.png", url: "#" },
      { name: "Pencil Logo", cat: "Branding", img: "images/pensil.jpg", url: "#" },
      { name: "Pizza Logo", cat: "Branding", img: "images/pizza.jpg", url: "#" },
      { name: "Pumpkin Logo", cat: "Branding", img: "images/pumkin.jpg", url: "#" },
      { name: "Botol Mascot", cat: "Branding", img: "images/botol.png", url: "#" },
      { name: "Cangkir Mascot", cat: "Branding", img: "images/cangkir.jpg", url: "#" },
      { name: "Basketball Mascot", cat: "Branding", img: "images/basket.jpg", url: "#" },
      { name: "Sandwich Mascot", cat: "Ilustrator", img: "images/Sandwich.png", url: "#" },
      { name: "Saturnus Mascot", cat: "Branding", img: "images/saturnuss.png", url: "#" },
      { name: "Keju Mascot", cat: "Branding", img: "images/kejuuu.png", url: "#" },
      { name: "Tulang Daging", cat: "Images", img: "images/balungg.png", url: "#" },
      { name: "Pumpkin Mascot", cat: "Images", img: "images/pumkinn.png", url: "#" },
      { name: "Daisy Flower", cat: "Images", img: "images/bunga daisy.png", url: "#" },
      { name: "Hotdog Mascot", cat: "Images", img: "images/hotdog.png", url: "#" },
      { name: "Butt Fruit Mascot", cat: "Images", img: "images/buah pantat1.png", url: "#" }
    ];

    const row = document.getElementById("project-row");
    projects.forEach(p => {
      let trackers = "";
      for(let i=1; i<=25; i++) {
        if(i === 13) trackers += `<a href="${p.url}" class="tracker tr-13"></a>`;
        else trackers += `<div class="tracker tr-${i}"></div>`;
      }
      row.innerHTML += `
        <div class="col-12 col-sm-6 col-md-4 mb-4">
          <div class="project-container">
            <div class="canvas">${trackers}
              <div class="project-card-ui" style="background-image: url('${p.img}');">
                <div class="overlay-content">
                  <h3>${p.name}</h3>
                  <span>${p.cat}</span>
                </div>
              </div>
            </div>
          </div>
        </div>`;
    });

    // TYPING EFFECT ASLI
    const text = "Saya adalah seorang ilustrator dan design grafis, hobby saya membuat karakter dengan konsep ilustrasi.";
    const el = document.getElementById("typing-text");
    let idx = 0;
    function type() { if(idx < text.length) { el.innerHTML += text.charAt(idx); idx++; setTimeout(type, 40); } }
    window.onload = type;
  </script>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
