<!DOCTYPE html>
<html lang="en">
<head>
  <title>Projects - MUHAMAD LUTHFIAN</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,600,700,900" rel="stylesheet">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <style>
  .navbar-toggler-icon {
      /* Menggunakan SVG custom dengan stroke warna kuning #ffbd39 */
      background-image: url("data:image/svg+xml;charset=utf8,%3Csvg viewBox='0 0 30 30' xmlns='http://www.w3.org/2000/svg'%3e%3Cpath stroke='%23ffbd39' stroke-width='2' stroke-linecap='round' stroke-miterlimit='10' d='M4 7h22M4 15h22M4 23h22'/%3e%3C/svg%3e") !important;
  }

  /* Efek saat tombol di-hover atau di-klik sesuai permintaanmu */
  .navbar-toggler:hover, 
  .navbar-toggler:focus {
      text-decoration: none;
      outline: none !important;
      border-color: #ffbd39 !important;
      box-shadow: 0 0 8px rgba(255, 189, 57, 0.5);
  }

    /* --- RESET & BASE --- */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: #000; color: white; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }

    /* --- CUSTOM NAVBAR --- */
    .custom-navbar {
      background-color: #000 !important;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 215, 0, 0.1);
      position: sticky;
      top: 0;
      z-index: 9999;
    }
    .navbar-brand { font-weight: 900; letter-spacing: 0px; color: #fff !important; }
    .nav-link { color: rgba(255,255,255,0.7) !important; font-weight: 400; }
    .nav-link.active { color: #FFD700 !important; }

    /* --- HEADER ASLI --- */
    .ftco-section { padding: 40px 0; }
    .project-heading-wrapper { position: relative; padding: 30px 0; text-align: center; }
    .bg-text { font-size: 90px; font-weight: 900; color: rgba(255, 255, 255, 0.1); position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 0; pointer-events: none; }
    .main-title { font-size: 2.5rem; font-weight: 800; color: white; z-index: 2; position: relative; }
    .subtext { font-size: 1rem; color: #bdbdbd; z-index: 2; position: relative; margin: 10px auto; border-right: 2px solid #FFD700; width: fit-content; padding-right: 10px; }

    /* --- ULTRA-SMOOTH 3D CARD SYSTEM --- */
    .project-container {
      position: relative;
      width: 100%;
      height: 320px;
      margin-bottom: 30px;
      /* Memaksa browser menggunakan Hardware Acceleration */
      transform: translateZ(0);
      will-change: transform;
    }

    .canvas {
      perspective: 1500px; /* Perspective lebih dalam untuk efek 3D halus */
      inset: 0;
      z-index: 200;
      position: absolute;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
    }

    .tracker { position: relative; z-index: 300; width: 100%; height: 100%; }
    .tracker.tr-13 { cursor: pointer; }

    .project-card-ui {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 18px;
      background-size: cover;
      background-position: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
      transform-style: preserve-3d;
      pointer-events: none;
      
      /* --- OPTIMASI ANIMASI (SMOOTH & NO DELAY) --- */
      /* Menggunakan Cubic Bezier untuk gerakan fisik alami */
      transition: all 0.5s cubic-bezier(0.215, 0.610, 0.355, 1.000); 
      will-change: transform, box-shadow; /* Beritahu browser elemen ini akan bergerak */
      backface-visibility: hidden; /* Hindari flicker pada rendering 3D */
    }

    /* Glow aktif di semua sudut */
    .tracker:hover ~ .project-card-ui {
      box-shadow: 0 10px 30px rgba(255, 215, 0, 0.2);
      border: 1px solid rgba(255, 215, 0, 0.4);
    }

    /* Efek Zoom & Glow Lebih Terang hanya saat di tengah (Link Aktif) */
    .tr-13:hover ~ .project-card-ui {
      box-shadow: 0 15px 40px rgba(255, 217, 0, 0.501);
      filter: brightness(1.15);
    }

    /* Overlay Glassmorphism */
    .project-card-ui .overlay-content {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(0.7px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0;
      transition: opacity 0.4s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .tracker:hover ~ .project-card-ui .overlay-content { opacity: 1; }

    /* Text Styling dengan Z-Depth */
    .project-card-ui h3 { 
      font-size: 1.4rem; 
      font-weight: 700; 
      color: #fff; 
      margin: 0;
      transform: translateZ(80px); /* Teks melayang jauh di depan */
      text-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .project-card-ui span { 
      color: #FFD700; 
      font-size: 0.8rem; 
      font-weight: 600; 
      transform: translateZ(50px);
      letter-spacing: 2px;
      margin-top: 8px;
      text-transform: uppercase;
    }

    /* --- LOGIKA ROTASI 25 TITIK --- */
    /* Menggunakan derajat yang sedikit lebih rendah agar gerakan terasa lebih terkontrol/mahal */
    .tr-1:hover ~ .project-card-ui { transform: rotateX(15deg) rotateY(-15deg); }
    .tr-3:hover ~ .project-card-ui { transform: rotateX(15deg) rotateY(0deg); }
    .tr-5:hover ~ .project-card-ui { transform: rotateX(15deg) rotateY(15deg); }
    .tr-11:hover ~ .project-card-ui { transform: rotateX(0deg) rotateY(-15deg); }
    .tr-13:hover ~ .project-card-ui { transform: rotateX(0deg) rotateY(0deg) scale(1.08); } /* Zoom Tengah */
    .tr-15:hover ~ .project-card-ui { transform: rotateX(0deg) rotateY(15deg); }
    .tr-21:hover ~ .project-card-ui { transform: rotateX(-15deg) rotateY(-15deg); }
    .tr-23:hover ~ .project-card-ui { transform: rotateX(-15deg) rotateY(0deg); }
    .tr-25:hover ~ .project-card-ui { transform: rotateX(-15deg) rotateY(15deg); }

    /* --- RESPONSIVE OPTIMIZATION --- */
    @media (pointer: coarse) {
      /* Mobile/Layar Sentuh: Animasi lebih cepat agar terasa instan saat di-tap */
      .project-card-ui { transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1); }
      .container-3d:active .overlay-content { opacity: 1; } /* Munculkan overlay saat ditekan */
    }

    @media (max-width: 768px) {
      .bg-text { font-size: 12vw; top: 10px; }
      .main-title { font-size: 2rem; }
      .project-container { height: 280px; }
    }
    /* --- NAVBAR STYLE (CLARK TEMPLATE WITH ANIMATED UNDERLINE) --- */
.custom-navbar {
    background-color: #000 !important;
    padding: 15px 0;
    border-bottom: 1px solid rgba(255, 189, 57, 0.1);
    position: sticky;
    top: 0;
    z-index: 9999;
}

.navbar-brand {
    font-weight: 900;
    color: #fff !important;
    text-transform: uppercase;
    font-size: 24px;
}

/* Base style untuk link navigasi */
.navbar-nav .nav-item .nav-link {
    color: #fff !important;
    font-weight: 400;
    padding: 10px 15px !important;
    transition: 0.3s;
    position: relative; /* Wajib ada untuk posisi garis */
}

/* Efek Warna saat Hover */
.navbar-nav .nav-item .nav-link:hover, 
.navbar-nav .nav-item .nav-link.active {
    color: #ffbd39 !important;
}

/* Membuat Garis Kuning (Hidden by default) */
.navbar-nav .nav-item .nav-link::after {
    content: "";
    position: absolute;
    width: 0; /* Mulai dari lebar 0 */
    height: 2px;
    bottom: 0;
    left: 15px; /* Sesuaikan dengan padding-left link */
    background-color: #ffbd39;
    visibility: hidden;
    transition: all 0.3s ease-in-out; /* Animasi memanjang */
}

/* Animasi Garis saat Hover */
.navbar-nav .nav-item .nav-link:hover::after {
    visibility: visible;
    width: calc(100% - 30px); /* Memanjang sesuai lebar teks */
}

/* Garis yang selalu muncul pada link Active */
.navbar-nav .nav-item .nav-link.active::after {
    visibility: visible;
    width: calc(100% - 30px);
}

/* Ikon Media Sosial tetap simpel */
.nav-link-icon {
    color: #fff !important;
    font-size: 18px;
    margin-left: 12px;
    transition: 0.3s;
    display: inline-block;
}

.nav-link-icon:hover {
    color: #ffbd39 !important;
    transform: translateY(-3px);

}
@media (max-width: 576px) {
    /* Menghilangkan padding pada container agar konten menyentuh tepi layar */
    .container-projects {
        padding-left: 0 !important;
        padding-right: 0 !important;
        max-width: 90% !important;
    }

    /* Menghilangkan padding pada kolom agar kartu memenuhi lebar */
    .project-col {
        padding-left: 0 !important;
        padding-right: 0 !important;
    }

    /* Menghilangkan border-radius jika ingin benar-benar 'kotak' memenuhi layar */
    .project-card-ui {
        border-radius: 20px !important; 
        border-left: none;
        border-right: none;
    }
    
    .project-container {
        height: 350px; /* Opsional: sedikit lebih tinggi di mobile agar puas dilihat */
        margin-bottom: 10px; /* Jarak antar kartu lebih rapat */
    }
}
  </style>
</head>

<body>

    <div class="container d-flex justify-content-between align-items-center">

            <a href="#" class="nav-link-icon"><i class="fa fa-linkedin"></i></a>

  </section>

  <script>
    // DAFTAR KONTEN GAMBAR KAMU

      { name: "Daisy Flower", cat: "Images", img: "images/bunga daisy.png", url: "https://lynk.id/disableflow/8grxvoznrwl2" },
      { name: "Hotdog Mascot", cat: "Images", img: "images/hotdog.png", url: "https://lynk.id/disableflow/x8914z3d6o1m" },
      { name: "Butt Fruit Mascot", cat: "Images", img: "images/buah pantat1.png", url: "#" },
      { name: "Mushroom", cat: "Images", img: "images/jamur.jpg", url: "https://lynk.id/disableflow/vn140wdq94p4" },
      { name: "Vodka", cat: "Images", img: "images/vodka.png", url: "https://lynk.id/disableflow/p0kqm4ymegw1" },
      { name: "Pohon", cat: "Images", img: "images/pohon.jpg", url: "https://lynk.id/disableflow/0g530dq19n2g" },
      { name: "Cup", cat: "Images", img: "images/cup.png", url: "https://lynk.id/disableflow/qo7p8x9x1yl3" },
      { name: "yummy", cat: "Images", img: "images/yummy.png", url: "#"},
    ];

    const row = document.getElementById("project-row");
    
    // Generate ke-23 kartu secara otomatis
    projects.forEach(p => {
      let trackers = "";
      for(let i=1; i<=25; i++) {
        // Tracker 13 bertindak sebagai link, yang lainnya hanya sensor gerakan
        if(i === 13) trackers += `<a href="${p.url}" class="tracker tr-13"></a>`;
        else trackers += `<div class="tracker tr-${i}"></div>`;
      }
          
    row.innerHTML += `
      <div class="col-12 col-sm-6 col-md-4 mb-4 project-col"> <div class="project-container">
          <div class="canvas">${trackers}
            <div class="project-card-ui" style="background-image: url('${p.img}');">
              <div class="overlay-content">
                <h3>${p.name}</h3>
                <span>${p.cat}</span>
              </div>
            </div>
          </div>
        </div>
      </div>`;
    });

    // TYPING EFFECT ASLI KAMU
    const text = "Saya adalah seorang ilustrator dan design grafis, hobby saya membuat karakter dengan konsep ilustrasi, Request/Order My Ilustration in digital products ⤵️";
    const el = document.getElementById("typing-text");
    let idx = 0;
    function type() { if(idx < text.length) { el.innerHTML += text.charAt(idx); idx++; setTimeout(type, 40); } }
    window.onload = type;
  </script>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
